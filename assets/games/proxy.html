DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donut Proxy</title>
    <link rel="icon" href="https://donuts2.w3spaces.com/cursor.png"
sizes="32x32" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,100..900;1,100..900&display=swap"
rel="stylesheet">
    <style>
        :root {
            --btnclr: #ff71a7;
            --bckclr: #000000;
        }
        body {
            background-color: var(--bckclr);
            cursor: url(https://donuts2.w3spaces.com/cursor.png), auto;
            margin: 0;
            padding: 40px 20px;
            font-family: "Jost", sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 80vh;
        }
        .container {
            width: 100%;
            max-width: 600px;
            text-align: center;
        }
        h1 {
            color: var(--btnclr);
            font-size: 45px;
            letter-spacing: 10px;
            text-shadow: 1px 1px 6px var(--btnclr), 1px 1px 6px var(--btnclr);
            margin-bottom: 5px;
        }
        p.link-text {
            color: var(--btnclr);
            font-size: 13px;
            letter-spacing: 4px;
            text-shadow: 1px 1px 3px var(--btnclr);
            margin: 15px 0;
            line-height: 1.6;
        }
        .input-group {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-top: 30px;
            width: 100%;
        }
        #customUrlInput {
            width: 70%;
            height: 45px;
            border-radius: 10px;
            border: 2px solid var(--btnclr);
            background: transparent;
            color: var(--btnclr);
            font-size: 18px;
            padding: 5px 15px;
            outline: none;
            box-shadow: 0 0 10px var(--btnclr);
            font-family: 'Jost', sans-serif;
            transition: 0.3s ease-in-out;
        }
        #customUrlInput:focus {
            box-shadow: 0 0 20px var(--btnclr);
        }
        .btn-submit {
            cursor: url(https://donuts2.w3spaces.com/cursor.png), auto;
            background-color: transparent;
            border: 2px solid var(--btnclr);
            color: var(--btnclr);
            font-size: 16px;
            letter-spacing: 2px;
            width: 100px;
            height: 59px;
            border-radius: 10px;
            transition: all 0.3s ease-in-out;
            box-shadow: 0 0 10px var(--btnclr), inset 0 0 5px var(--btnclr);
            font-family: "Jost", sans-serif;
        }
        .btn-submit:hover {
            background-color: var(--btnclr);
            color: var(--bckclr);
            box-shadow: 0 0 20px var(--btnclr);
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>DONUT PROXY</h1>

        <p class="link-text"><b>I HAVE MADE NO MONEY FROM THIS PROJECT</b></p>
        <p class="link-text">This is an experimental proxy. Some
third-party elements or websites may refuse connections inside
sandboxed layouts.</p>

        <div class="input-group">
            <input id="customUrlInput" type="text" placeholder="Enter
any URL (e.g., google.com)..." onkeydown="if(event.key === 'Enter')
openCustomUrl()">
            <button class="btn-submit" onclick="openCustomUrl()">OPEN</button>
        </div>
    </div>

    <script>
        function playInIframe(url) {
            const win = window.open("about:blank", "_blank");
            if (!win) {
                alert("Pop-up blocked! Please allow pop-ups for this domain.");
                return;
            }

            setTimeout(() => {
                const doc = win.document;
                const iframe = doc.createElement("iframe");
                iframe.src = url;
                iframe.style.position = "fixed";
                iframe.style.top = "0";
                iframe.style.left = "0";
                iframe.style.width = "100vw";
                iframe.style.height = "100vh";
                iframe.style.border = "none";
                iframe.sandbox = "allow-scripts allow-pointer-lock
allow-forms allow-popups";
                iframe.allowFullscreen = true;
                doc.body.style.margin = "0";
                doc.body.appendChild(iframe);
            }, 200);
        }

        function openCustomUrl() {
            const input = document.getElementById("customUrlInput");
            if (!input) return;

            const url = input.value.trim();
            if (!url) {
                alert("Please enter a destination web URL first.");
                return;
            }

            const finalUrl = url.startsWith("http://") ||
url.startsWith("https://") ? url : "https://" + url;
            playInIframe(finalUrl);
        }
    </script>
</body>
</html>
