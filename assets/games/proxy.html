.button {
position: relative;

width: 10%; aspect-ratio: 1 / 1; /* forces a perfect square */ height: auto;
border-radius: 20px;
overflow: hidden;

background-color: transparent;
transition: 0.3s ease-in-out;
padding: 0;
}

/* Image fills entire button */
.button img {
width: 100%;
height: 100%;
object-fit: cover;
display: block;
transition: 0.3s ease-in-out;
filter: brightness(0.8);
}

/* Text overlay (hidden by default) */
.button span {
position: absolute;
bottom: 0;
left: 50%;

background: rgba(0,0,0,0.6);

font-family: "Jost", sans-serif;
font-size: 16px;
letter-spacing: 2px;
text-align: center;

transition: 0.3s ease-in-out;
}


/* Hover effects */

filter: brightness(0.4);
transform: scale(1.05);
}

.button:hover span {
opacity: 1;
}

<script>
const hideKeywords = [
"baldi",
"adventure",
"bad",
"race",
"aqua",
"alien",
"merge",
"robbery",
"bfdia",
"archery",
"friday",
"run",
"build",
"baz",
"port",
"master",
"arthur",
"blade",
"bloo",
"achieve",
"-battle",
"fu",
"cut-",
"bend",
"basketball",
"frvr",
"ball-",
];

function shouldHide(name) {
const lower = name.toLowerCase();
return hideKeywords.some(k => lower.includes(k));
}
function setButtonColor(color) {
document.body.style.setProperty('--btnclr', color);
}
function setBackgroundColor(color) {
document.body.style.setProperty('--bckclr', color);
}
setButtonColor('#ff71a7');
setBackgroundColor('black');
async function opengame(url) {
const res = await fetch(url);
if (!res.ok) return;

const html = await res.text();
const win = window.open();
if (!win) return;

win.document.body.style.margin = "0";
win.document.body.style.height = "100vh";

const iframe = win.document.createElement("iframe");
iframe.style.border = "none";
iframe.style.width = "100%";
iframe.style.height = "100%";
iframe.srcdoc = html;

win.document.body.appendChild(iframe);
}
function playInIframe(url) {
const win = window.open("about:blank", "_blank");
if (!win) return;

setTimeout(() => {
const doc = win.document;
const iframe = doc.createElement("iframe");
iframe.src = url;
iframe.style.position = "fixed";
iframe.style.top = "0";
iframe.style.left = "0";
iframe.style.width = "100vw";
iframe.style.height = "100vh";
iframe.style.border = "none";
iframe.sandbox = "allow-scripts allow-same-origin allow-pointer-lock
allow-forms allow-popups";
iframe.allowFullscreen = true;
doc.body.style.margin = "0";
doc.body.appendChild(iframe);
}, 200);
}
function updateGameCount() {
const count = document.querySelectorAll("#game-buttons button").length;
const el = document.getElementById("game-count");
if (el) el.textContent = "Total Games: " + count;
}
async function loadGames() {
const gamesApi =
"https://api.github.com/repos/lewismann623-creator/cheetopuff/contents/assets/games";
const imagesApi =
"https://api.github.com/repos/lewismann623-creator/cheetopuff/contents/assets/images";

const [gamesRes, imagesRes] = await Promise.all([
fetch(gamesApi),
fetch(imagesApi)
]);

const gameFiles = await gamesRes.json();
const imageFiles = await imagesRes.json();

const games = {};

// Process HTML game files
gameFiles.forEach(file => {
if (file.name.endsWith(".html")) {
const name = file.name.split(".")[0];
games[name] = { html: file.download_url };
}
});

// Process images
imageFiles.forEach(file => {
if (file.name.match(/\.(png|jpg|jpeg|gif)$/i)) {
const name = file.name.split(".")[0];
if (!games[name]) games[name] = {};
games[name].img = file.download_url;
}
});

const container = document.getElementById("game-buttons");

Object.keys(games).forEach(name => {
if (!games[name].html) return;
if (shouldHide(name)) return;

const game = games[name];

const btn = document.createElement("button");
btn.className = "button";

btn.innerHTML = `
<img src="${game.img || ''}" loading="lazy">
<span>${name.replace(/-/g, " ")}</span>
`;

btn.onclick = () => opengame(game.html);

container.appendChild(btn);
});

updateGameCount();
}
function addGame(name, icon, url) {
if (shouldHide(name)) return;

const container = document.getElementById("game-buttons");

const btn = document.createElement("button");
btn.className = "button";

btn.innerHTML = `
<img src="${icon}">
<span>${name}</span>
`;

btn.onclick = () => playInIframe(url);

container.appendChild(btn);
updateGameCount();
}
function openCustomUrl() {
const input = document.getElementById("customUrlInput");
if (!input) return;

const url = input.value.trim();
if (!url) return alert("Enter a URL first");

const finalUrl = url.startsWith("http") ? url : "https://" + url;
playInIframe(finalUrl);
}
document.getElementById("search").addEventListener("input", function () {
const term = this.value.toLowerCase();
const buttons = document.querySelectorAll("#game-buttons button");

buttons.forEach(btn => {
const text = btn.textContent.toLowerCase();
btn.style.display = text.includes(term) ? "flex" : "none";
});
});

(async () => {
await loadGames();

addGame("deadshot", "https://deadshot.io/favicon.png", "https://deadshot.io");
addGame("escape road working",
"https://api.github.com/repos/lewismann623-creator/cheetopuff/contents/assets/images/escape-road.png",
"https://escaperoad.io/escape-road");
addGame("ships 3d", "https://yp3d.com/favicon.png", "https://yp3d.com/ships3d");
addGame("speed stars", "https://1games.io/speed-stars",
"https://speedstars2.io");
})();
</script>
