/* Custom Responsive Scrollbar */

body {

.button { 
    position: relative; 
    cursor: var(--custom-cursor); 
    width: clamp(100px, 11vw, 140px); 
    aspect-ratio: 1 / 1; /* forces a perfect square */ 
    height: auto; 
    border-radius: 20px; 
    overflow: hidden; 
    border: 1px solid var(--border-frame); 
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3); 
    background-color: rgba(255, 255, 255, 0.02); 
    backdrop-filter: blur(12px); 
    transition: 0.3s ease-in-out; 
    padding: 0; 
} 

/* Image fills entire button */ 
.button img { 
    width: 100%; 
    height: 100%; 
    object-fit: cover; 
    display: block; 
    transition: 0.3s ease-in-out; 
    filter: brightness(0.85); 
} 

/* Text overlay (hidden by default) */ 
.button span { 
    position: absolute; 
    bottom: 0; 
    left: 50%; 
    transform: translateX(-50%) translateY(8px); /* centers it perfectly */ 
    width: 100%; 
    padding: 16px 10px;

<script> 
// Add focus styles dynamically to match the styling 
document.getElementById("search").addEventListener("focus", function() { 
    this.style.borderColor = "var(--btnclr)"; 
    this.style.boxShadow = "0 0 20px var(--panel-glow)"; 
}); 
document.getElementById("search").addEventListener("blur", function() { 
    this.style.borderColor = "var(--border-frame)"; 
    this.style.boxShadow = "0 8px 32px rgba(0,0,0,0.2)"; 
}); 

const hideKeywords = [ 
    "baldi", "adventure", "bad", "race", "aqua", "alien", "merge", "robbery", 
    "bfdia", "archery", "friday", "run", "build", "baz", "port", "master", 
    "arthur", "blade", "bloo", "achieve", "-battle", "fu", "cut-", "bend", 
    "basketball", "frvr", "ball-", 
]; 

async function loadSplashText() {
    const splashUrl = "https://raw.githubusercontent.com/lewismann623-creator/cheetopuff/refs/heads/main/assets/images/splash.txt";
    
    // 1. Fallback list of splash texts used if the URL link fails
    const fallbackSplashes = [
        
        "MMM...DONUTS"
    ];

    try {
        const res = await fetch(splashUrl);
        if (!res.ok) throw new Error("Network response error");
        
        const text = await res.text();
        if (text && text.trim().length > 0) {
            // 2. Split the file contents by new lines into an array
            const splashes = text.split('\n')
                                 .map(line => line.trim())
                                 .filter(line => line.length > 0);
            
            // 3. Pick a random item from the file list
            const randomSplash = splashes[Math.floor(Math.random() * splashes.length)];
            document.getElementById("splash-text").textContent = randomSplash.toUpperCase();
            return;
        }
    } catch (err) {
        console.warn("Failed loading remote splash payload, using local random asset string.", err);
    }

    // 4. Fallback handler picks a random item from your local list if the fetch breaks
    const randomFallback = fallbackSplashes[Math.floor(Math.random() * fallbackSplashes.length)];
    document.getElementById("splash-text").textContent = randomFallback.toUpperCase();
}

function shouldHide(name) { 
    const lower = name.toLowerCase(); 
    return hideKeywords.some(k => lower.includes(k)); 
} 

function setButtonColor(color) { 
    document.body.style.setProperty('--btnclr', color); 
} 

function setBackgroundColor(color) { 
    document.body.style.setProperty('--bckclr', color); 
} 

setButtonColor('#b549ff'); 
setBackgroundColor('#0a0714'); 

async function opengame(url) { 
    const res = await fetch(url); 
    if (!res.ok) return; 
    const html = await res.text(); 
    const win = window.open(); 
    if (!win) return; 
    win.document.body.style.margin = "0"; 
    win.document.body.style.height = "100vh"; 
    const iframe = win.document.createElement("iframe"); 
    iframe.style.border = "none"; 
    iframe.style.width = "100%"; 
    iframe.style.height = "100%"; 
    iframe.srcdoc = html; 
    win.document.body.appendChild(iframe); 
} 

function playInIframe(url) { 
    const win = window.open("about:blank", "_blank"); 
    if (!win) return; 
    setTimeout(() => { 
        const doc = win.document; 
        const iframe = doc.createElement("iframe"); 
        iframe.src = url; 
        iframe.style.position = "fixed"; 
        iframe.style.top = "0"; 
        iframe.style.left = "0"; 
        iframe.style.width = "100vw"; 
        iframe.style.height = "100vh"; 
        iframe.style.border = "none"; 
        iframe.sandbox = "allow-scripts allow-same-origin allow-pointer-lock allow-forms allow-popups"; 
        iframe.allowFullscreen = true; 
        doc.body.style.margin = "0"; 
        doc.body.appendChild(iframe); 
    }, 200); 
} 

function updateGameCount() { 
    const count = document.querySelectorAll("#game-buttons button").length; 
    const el = document.getElementById("game-count"); 
    if (el) el.textContent = "Total Games: " + count; 
} 

async function loadGames() { 
    const gamesApi = "https://api.github.com/repos/lewismann623-creator/cheetopuff/contents/assets/games"; 
    const imagesApi = "https://api.github.com/repos/lewismann623-creator/cheetopuff/contents/assets/images"; 
    
    const [gamesRes, imagesRes] = await Promise.all([ 
        fetch(gamesApi), 
        fetch(imagesApi) 
    ]); 
    const gameFiles = await gamesRes.json(); 
    const imageFiles = await imagesRes.json(); 
    const games = {}; 

    // Process HTML game files 
    gameFiles.forEach(file => { 
        if (file.name.endsWith(".html")) { 
            const name = file.name.split(".")[0]; 
            games[name] = { html: file.download_url }; 
        } 
    }); 

    // Process images 
    imageFiles.forEach(file => { 
        if (file.name.match(/\.(png|jpg|jpeg|gif)$/i)) { 
            const name = file.name.split(".")[0]; 
            if (!games[name]) games[name] = {}; 
            games[name].img = file.download_url; 
        } 
    }); 

    const container = document.getElementById("game-buttons"); 
    Object.keys(games).forEach(name => { 
        if (!games[name].html) return; 
        if (shouldHide(name)) return; 
        const game = games[name]; 
        const btn = document.createElement("button"); 
        btn.className = "button"; 
        btn.innerHTML = ` 
            <img src="${game.img || ''}" loading="lazy"> 
            <span>${name.replace(/-/g, " ")}</span> 
        `; 
        btn.onclick = () => opengame(game.html); 
        container.appendChild(btn); 
    }); 
    updateGameCount(); 
} 

function addGame(name, icon, url) { 
    if (shouldHide(name)) return; 
    const container = document.getElementById("game-buttons"); 
    const btn = document.createElement("button"); 
    btn.className = "button"; 
    btn.innerHTML = ` 
        <img src="${icon}"> 
        <span>${name}</span> 
    `; 
    btn.onclick = () => playInIframe(url); 
    container.appendChild(btn); 
    updateGameCount(); 
} 

document.getElementById("search").addEventListener("input", function () { 
    const term = this.value.toLowerCase(); 
    const buttons = document.querySelectorAll("#game-buttons button"); 
    buttons.forEach(btn => { 
        const text = btn.textContent.toLowerCase(); 
        btn.style.display = text.includes(term) ? "flex" : "none"; 
    }); 
});
